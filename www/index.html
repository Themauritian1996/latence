<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Latence, lecture EMG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecf0; --surface:#f4f6f9; --surface-2:#e2e6eb; --text:#0b0c0e; --muted:#6c717a; --line:#d5dae0;
  --ink:#0b0c0e; --ink-contrast:#ffffff; --pos:#119a4c; --neg:#d8383d; --warn:#b7791f;
  --lift:7px 7px 18px rgba(160,169,183,.45), -7px -7px 18px rgba(255,255,255,.95);
  --press:inset 3px 3px 7px rgba(160,169,183,.45), inset -3px -3px 7px rgba(255,255,255,.95);
  --nav:rgba(236,239,243,.88); --scrim:rgba(20,22,26,.35);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#121214; --surface-2:#1c1c1f; --text:#f4f4f5; --muted:#8b8b93; --line:#242428;
    --ink:#f4f4f5; --ink-contrast:#000000; --pos:#30d158; --neg:#ff453a; --warn:#ffb340;
    --lift:0 0 0 1px #1d1d21; --press:inset 0 0 0 1px #2a2a2f;
    --nav:rgba(0,0,0,.84); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121214; --surface-2:#1c1c1f; --text:#f4f4f5; --muted:#8b8b93; --line:#242428;
  --ink:#f4f4f5; --ink-contrast:#000000; --pos:#30d158; --neg:#ff453a; --warn:#ffb340;
  --lift:0 0 0 1px #1d1d21; --press:inset 0 0 0 1px #2a2a2f;
  --nav:rgba(0,0,0,.84); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{height:100%;background:var(--bg)}
:root{--acc:#119a4c;--acc-ink:#fff}
:root[data-accent="green"]{--acc:#119a4c}
@media (prefers-color-scheme: dark){:root[data-accent="green"]:not([data-theme="light"]){--acc:#30d158;--acc-ink:#000}}
:root[data-theme="dark"][data-accent="green"]{--acc:#30d158;--acc-ink:#000}
:root[data-accent="blue"]{--acc:#0a66d6}
@media (prefers-color-scheme: dark){:root[data-accent="blue"]:not([data-theme="light"]){--acc:#0a84ff;--acc-ink:#000}}
:root[data-theme="dark"][data-accent="blue"]{--acc:#0a84ff;--acc-ink:#000}
:root[data-accent="violet"]{--acc:#8944ab}
@media (prefers-color-scheme: dark){:root[data-accent="violet"]:not([data-theme="light"]){--acc:#bf5af2;--acc-ink:#000}}
:root[data-theme="dark"][data-accent="violet"]{--acc:#bf5af2;--acc-ink:#000}
:root[data-accent="orange"]{--acc:#b45f00}
@media (prefers-color-scheme: dark){:root[data-accent="orange"]:not([data-theme="light"]){--acc:#ff9f0a;--acc-ink:#000}}
:root[data-theme="dark"][data-accent="orange"]{--acc:#ff9f0a;--acc-ink:#000}
:root[data-accent="pink"]{--acc:#c8234a}
@media (prefers-color-scheme: dark){:root[data-accent="pink"]:not([data-theme="light"]){--acc:#ff375f;--acc-ink:#000}}
:root[data-theme="dark"][data-accent="pink"]{--acc:#ff375f;--acc-ink:#000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-accent]){--acc:#30d158;--acc-ink:#000}}
:root[data-theme="dark"]:not([data-accent]){--acc:#30d158;--acc-ink:#000}
html[data-size="l"]{zoom:1.1} html[data-size="xl"]{zoom:1.22}
.swatch{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)} .swatch.on{outline:2px solid var(--text);outline-offset:3px}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px} .lock-in{max-width:320px;width:100%;text-align:center} .pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0 22px} .pin-dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted)} .pin-dots i.on{background:var(--text);box-shadow:none} .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .keypad button{height:64px;border-radius:50%;font-size:24px;font-weight:300;background:var(--surface);box-shadow:var(--lift)} .keypad button:active{box-shadow:var(--press)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.ic{display:block;flex:none}
.wrap{max-width:620px;margin:0 auto;padding:6px 18px calc(120px + env(safe-area-inset-bottom,0px))}
a{color:inherit}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{max-width:620px;margin:0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
.brand{font-weight:500;font-size:15px;letter-spacing:.42em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand svg{color:var(--acc)}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand{letter-spacing:.28em;gap:8px}.top-in{gap:4px}}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--pos)}
.sync.err::before{background:var(--neg)}
.sync.wait::before{background:var(--warn)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.icon-btn:active{box-shadow:var(--press)}

/* Typo */
.status{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.hero-title{font-weight:300;font-size:clamp(34px,10vw,46px);line-height:1.04;letter-spacing:-.015em;margin:6px 0 8px}
.hero-sub{margin:0 0 18px;color:var(--muted)}
.h2{font-weight:400;font-size:26px;letter-spacing:-.01em;margin:10px 0 14px}
.h3{font-weight:500;font-size:17px;margin:0 0 10px}
.h3 svg,.sh-title svg{display:inline-block;vertical-align:-3px;margin-right:6px}
summary svg.ic:first-child{display:inline-block;vertical-align:-4px;margin-right:8px}
.muted{color:var(--muted)}
.small{font-size:14px}
small{font-size:13px;color:var(--muted);display:block}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0}
.pre{white-space:pre-wrap}

/* Surfaces */
.card{background:var(--surface);border-radius:24px;box-shadow:var(--lift);padding:18px;margin:0 0 16px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border-radius:18px;box-shadow:var(--lift);margin:0 0 12px}
.row b{font-weight:500}
.r{text-align:right;flex:none}
.note{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface-2))}
.note.bad{background:color-mix(in srgb,var(--neg) 12%,var(--surface-2))}
.note.good{background:color-mix(in srgb,var(--pos) 12%,var(--surface-2))}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--ink);color:var(--ink-contrast)}
.btn.go{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:var(--surface);box-shadow:var(--lift)}
.btn.danger-ghost{color:var(--neg);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.big{min-height:54px;padding:0 30px;font-size:16px}
.btn.wide{width:100%;margin:0 0 12px}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.btns .btn{flex:1 1 auto}
.file-btn{cursor:pointer;position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Champs */
.field{width:100%;background:var(--surface-2);border:0;border-radius:14px;padding:12px 14px;font-size:16px;resize:vertical;min-width:0}
textarea.field{min-height:88px;line-height:1.45}
.lab{display:block;font-size:14px;color:var(--muted);margin:0 0 12px}
.lab .field{margin-top:6px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;margin:6px 0 12px}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--lift)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 10px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 2px 12px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--lift);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--ink-contrast);box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.pos{color:var(--pos);background:color-mix(in srgb,var(--pos) 13%,var(--surface-2))}
.tag.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 13%,var(--surface-2))}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--surface-2))}
.tag.ink{background:var(--ink);color:var(--ink-contrast)}

/* Accueil */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0 22px}
.stats3 b{font-weight:300;font-size:32px;display:block;line-height:1.1}
.stats3 span{font-size:13px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px}
.flow div{background:var(--surface);box-shadow:var(--lift);border-radius:18px;padding:12px 8px;text-align:center;font-size:12px;color:var(--muted)}
.flow div svg{margin:0 auto 6px;color:var(--text)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.sec-title h2{margin:0}
.case-row .who b{display:block;font-weight:500}
.case-row .who small{margin-top:2px}
.case-row .tags{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.day-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:18px 2px 10px}

/* Étapes du cas */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:4px 18px 10px}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 8px;border-radius:999px;background:var(--surface);box-shadow:var(--lift);font-size:14px;color:var(--muted)}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.step.done i{background:var(--acc);color:var(--acc-ink)}
.step.on{background:var(--ink);color:var(--ink-contrast);box-shadow:none}
.step.on i{background:var(--ink-contrast);color:var(--ink)}
.case-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:2px 0 10px}
.case-head h1{font-weight:300;font-size:clamp(28px,8vw,36px);line-height:1.08;letter-spacing:-.015em;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.bar-in .btn{flex:1}
.bar-in .btn.ghost{flex:0 0 auto}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 12px}
.ph{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface-2);box-shadow:var(--lift)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ph-acts{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-between}
.ph .ph-acts button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff}
.ph b{position:absolute;top:6px;left:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:2px 8px;font-weight:500}
.add-ph{aspect-ratio:3/4;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);box-shadow:var(--press)}

/* Tableau NCS */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px 4px;-webkit-overflow-scrolling:touch}
table.ncs{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
table.ncs th{font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.15;text-align:right;padding:6px;vertical-align:bottom;white-space:nowrap;border-bottom:1px solid var(--line)}
table.ncs th:first-child,table.ncs td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;white-space:normal;min-width:118px;max-width:150px;padding-left:2px}
table.ncs .tn{font-weight:500;display:block;line-height:1.25}
table.ncs{width:100%}
table.ncs td{padding:8px 6px;vertical-align:top;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.ncs tr.grp td{background:var(--surface-2);font-weight:500;text-align:left;font-size:13px;position:static}
table.ncs tr.grp td:first-child{background:var(--surface-2)}
table.ncs td .nm{display:block;font-size:11px;color:var(--muted)}
td.a,span.a{color:var(--neg);font-weight:600}
td.d,span.d{color:var(--neg);font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
td.x,span.x{color:var(--neg);font-weight:600}
td.n,span.n{color:var(--pos)}
td.z{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.flag:last-child{border-bottom:0}
.flag i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--muted)}
.flag.a i{background:var(--neg)} .flag.w i{background:var(--warn)} .flag.n i{background:var(--pos)}

/* Édition des lignes */
.ed-row{background:var(--surface);border-radius:18px;box-shadow:var(--lift);padding:12px 14px;margin:0 0 10px}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
.ed-top b{font-weight:500}
.ed-f{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.mini input,.mini select{width:100%;background:var(--surface-2);border:0;border-radius:11px;padding:9px 7px;font-size:15px;color:var(--text);min-width:0}
.mini.wide{grid-column:span 2}
.mini.full{grid-column:1/-1}

/* Analyse */
.concl{font-weight:300;font-size:22px;line-height:1.3;letter-spacing:-.005em;margin:4px 0 8px}
.musc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.musc:last-child{border-bottom:0}
.musc .tick{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:var(--press);color:transparent}
.musc.on .tick{background:var(--ink);color:var(--ink-contrast);box-shadow:none}
.musc b{font-weight:500}
.musc .inn{font-size:12.5px;color:var(--muted);margin:2px 0 4px}
.musc p{margin:0;font-size:14px}

/* EMG */
.emg-card{background:var(--surface);border-radius:20px;box-shadow:var(--lift);padding:14px;margin:0 0 12px}
.emg-card.abn{box-shadow:var(--lift),inset 3px 0 0 var(--neg)}
.emg-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:0 0 8px}
.emg-top b{font-weight:500;font-size:16px}
.emg-top small{margin-top:1px}
.opt-row{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;padding:4px 0}
.opt-row span{font-size:12.5px;color:var(--muted)}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts button{min-width:38px;min-height:34px;padding:0 9px;border-radius:999px;background:var(--surface-2);font-size:13.5px}
.opts button.on{background:var(--ink);color:var(--ink-contrast)}
.opts button.on.bad{background:var(--neg);color:#fff}

/* Rapport */
.rep{background:#fff;color:#111;border-radius:18px;padding:22px 20px;box-shadow:var(--lift);font-size:14px;line-height:1.5;margin:0 0 16px}
.rep h1{font-size:19px;font-weight:600;margin:0 0 2px}
.rep h2{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 6px;color:#333;border-bottom:1px solid #ddd;padding-bottom:4px}
.rep .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:13px;color:#333;margin:8px 0 0}
.rep table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.rep th,.rep td{border-bottom:1px solid #e3e3e3;padding:4px 5px;text-align:right;white-space:nowrap}
.rep th:first-child,.rep td:first-child{text-align:left;white-space:normal}
.rep th{font-weight:600;color:#444}
.rep td.a,.rep td.d,.rep td.x{color:#c62828;font-weight:600}
.rep td.d{text-decoration:underline}
.rep td.n{color:#111}
.rep table.meta td{border:0;text-align:left;padding:1px 12px 1px 0;white-space:normal;font-size:13px}
.rep .nm{display:block;font-size:10.5px;color:#777;font-weight:400}
.rep .leg{font-size:11px;color:#666;margin:2px 0 8px}
.rep p{margin:0 0 8px}
.rep .sig{margin-top:22px;font-size:13px}
.rep .disc{margin-top:14px;font-size:11px;color:#777}
.rep-tbl{overflow-x:auto;margin:0 -6px;padding:0 6px}
.rep-tbl table{min-width:540px}
.rep-tbl td:first-child{min-width:150px}
@media (max-width:560px){.rep table.meta,.rep table.meta tbody,.rep table.meta tr,.rep table.meta td{display:block;width:100%}.rep table.meta td{padding:1px 0}.rep{padding:20px 16px}.rep h1{font-size:17px}}
.sec-ed{margin:0 0 14px}
.sec-ed .lab{margin:0 0 4px}

/* Feuilles / modales */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:90%}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 14px}
.sh-title{font-weight:400;font-size:22px;margin:0}
.crop-stage{position:relative;background:#000;border-radius:16px;overflow:hidden;margin:0 0 12px;touch-action:none}
.crop-stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.crop-shade{position:absolute;background:rgba(0,0,0,.62);pointer-events:none}
.crop-box{position:absolute;box-shadow:inset 0 0 0 2px #fff;pointer-events:none}
.crop-h{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);touch-action:none}
.search{width:100%;background:var(--surface);box-shadow:var(--lift);border:0;border-radius:16px;padding:14px 16px;font-size:16px;margin:0 0 14px}
.lib-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.lib-item small{margin-top:1px}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:6px 8px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
.nav button.on{color:var(--text)}
.nav .go i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ink-contrast);margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* Chargement */
.busy{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;animation:fade .2s ease;padding:24px}
.busy-in{background:var(--bg);border-radius:26px;padding:26px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.busy-in p{margin:14px 0 0}
.busy-in small{margin-top:6px}
.wave{display:block;margin:0 auto;color:var(--acc)}
.wave path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:240}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--ink-contrast);padding:12px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
details.acc{background:var(--surface);border-radius:18px;box-shadow:var(--lift);margin:0 0 12px;padding:0 16px}
details.acc summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:500;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary svg{transform:rotate(180deg)}
details.acc .acc-in{padding:0 0 14px}
ol.howto{padding-left:20px;margin:6px 0;font-size:14.5px}
ol.howto li{margin:0 0 6px}
code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.norm-row{display:grid;grid-template-columns:1fr 58px 58px 58px 52px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.norm-row input{width:100%;background:var(--surface-2);border:0;border-radius:9px;padding:7px 4px;text-align:center;font-size:14px;min-width:0}
.norm-row.h{color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line)}
.norm-row.h span{text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  .top,.nav,.bar,.steps,.no-print,.case-head{display:none!important}
  .wrap{padding:0;max-width:none}
  .rep{box-shadow:none;border-radius:0;padding:0}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13h5l2-6 3 12 2.5-9 1.5 3h6"/></svg>LATENCE</span>
  <span id="sync" class="sync"></span>
  <button class="icon-btn" data-a="theme-cycle" aria-label="Thème" id="themebtn"></button>
  <button class="icon-btn" data-a="nav" data-v="settings" aria-label="Réglages" id="gear"></button>
</div></header>
<main id="view"></main>
<nav class="nav" id="navbar" aria-label="Navigation principale"><div class="nav-in" id="nav"></div></nav>
<div id="bar"></div>
<div id="sheets"></div>
<div id="busy"></div>
<div id="lock"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js?v=dev"></script>
<script src="js/i18n-dict.js?v=dev"></script>
<script src="js/core.js?v=dev"></script>
<script src="js/cloud.js?v=dev"></script>
<script src="js/drive-script.js?v=dev"></script>
<script src="js/docx.js?v=dev"></script>
